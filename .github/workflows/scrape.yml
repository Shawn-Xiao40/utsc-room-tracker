name: Scrape room availability

on:
  schedule:
    - cron: "7,37 * * * *"  # every 30 min (off the hour; GitHub may delay runs a few minutes)
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scraper.py

      - name: Commit new data
        if: always()  # also commit runs.csv when a scrape fails, so failures are visible
        run: |
          git config user.name "room-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
